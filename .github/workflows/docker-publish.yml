# Build and publish the multi-arch server image (linux/amd64 + linux/arm64).
#
# `main` publishes `latest` (and `main`), so the default Docker image always
# tracks the current Rust backend. Releases add plain semver tags and keep the
# historical `-rust` aliases for existing deployments.
#
# amd64 and arm64 are built on native runners (no QEMU), each pushing a digest;
# a final job merges the digests into one multi-arch manifest. Cargo registries
# and Docker layers are cached per architecture.

name: Docker Publish

on:
  push:
    branches: [main]
    paths:
      - 'serverrs/**'
      - 'client/**'
      - 'config/**'
      - 'bookmarks/**'
      - 'docker/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.base.json'
      - '.github/workflows/docker-publish.yml'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Extra image tag to publish (e.g. 2.11.8)"
        required: false

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push digest (${{ matrix.arch }})
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile.rust
          platforms: ${{ matrix.platform }}
          outputs: >-
            type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=server-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=server-${{ matrix.arch }}
      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${{ matrix.arch }}"
          digest="${{ steps.build.outputs.digest }}"
          echo "${digest#sha256:}" > "/tmp/digests/${{ matrix.arch }}"
      - uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/*
          retention-days: 1

  merge:
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v7
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true
      - name: Resolve image tags
        id: tags
        shell: bash
        run: |
          set -euo pipefail
          image="${REGISTRY}/${IMAGE_NAME}"
          names=()
          add() { names+=("$1"); }

          case "${GITHUB_EVENT_NAME}" in
            push)
              add "${image}:main"
              add "${image}:latest"
              add "${image}:latest-rust"
              ;;
            release)
              tag="${{ github.event.release.tag_name }}"
              tag="${tag#v}"
              tag="${tag%-rust}"
              add "${image}:${tag}"
              add "${image}:${tag}-rust"
              # A pre-release must not move the rolling production tag.
              if [ "${{ github.event.release.prerelease }}" != "true" ]; then
                add "${image}:latest"
                add "${image}:latest-rust"
              fi
              ;;
            workflow_dispatch)
              tag="${{ github.event.inputs.tag }}"
              tag="${tag#v}"
              tag="${tag%-rust}"
              if [ -n "${tag}" ]; then
                add "${image}:${tag}"
                add "${image}:${tag}-rust"
              fi
              add "${image}:latest"
              add "${image}:latest-rust"
              ;;
          esac

          # De-duplicate while preserving order.
          mapfile -t names < <(printf '%s\n' "${names[@]}" | awk 'NF && !seen[$0]++')
          echo "names=${names[*]}" >> "${GITHUB_OUTPUT}"
          printf 'Publishing:\n%s\n' "${names[@]}"
      - name: Create multi-arch manifest
        run: |
          set -euo pipefail
          cd /tmp/digests
          sources=$(for f in *; do
            printf '%s@sha256:%s ' "${REGISTRY}/${IMAGE_NAME}" "$(cat "$f")"
          done)
          args=()
          for name in ${{ steps.tags.outputs.names }}; do
            args+=(--tag "${name}")
          done
          docker buildx imagetools create "${args[@]}" ${sources}
      - name: Inspect manifests
        run: |
          set -euo pipefail
          for name in ${{ steps.tags.outputs.names }}; do
            docker buildx imagetools inspect "${name}"
          done
