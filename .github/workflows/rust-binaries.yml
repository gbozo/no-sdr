# Build native serverrs binaries for Linux (x86-64 v1..v4, ARM64 Pi cores),
# macOS (Apple Silicon + Intel) and Windows 11 (x86-64). On a release (or a
# manual dispatch) the binaries are packaged into portable archives together
# with the web client, config, bookmarks and launchers. The same trigger builds
# Electron desktop packages for Linux/macOS/Windows and publishes both sets of
# artifacts on the release.

name: Rust Binaries

on:
  push:
    branches: [main]
    paths:
      - 'serverrs/**'
      - 'client/**'
      - 'desktop/**'
      - 'config/**'
      - 'bookmarks/**'
      - 'packaging/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.base.json'
      - '.github/workflows/rust-binaries.yml'
  workflow_dispatch:
  release:
    types: [published]

concurrency:
  group: rust-binaries-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # audiopus_sys builds the bundled Opus with a CMakeLists that declares
  # cmake_minimum_required(VERSION 3.1); CMake 4 (Ubuntu 25.10+ runners)
  # rejects policy versions below 3.5. .cargo/config.toml sets the same value
  # for local builds. Harmless on CMake 3.x.
  CMAKE_POLICY_VERSION_MINIMUM: "3.5"

jobs:
  linux-amd64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: mozilla-actions/sccache-action@v0.0.11
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: serverrs -> target
          cache-targets: false
      - name: Build tools
        run: sudo apt-get update && sudo apt-get install -y cmake build-essential
      - name: Build x86-64 v1..v4
        run: |
          mkdir -p dist
          rustup target add x86_64-unknown-linux-gnu
          for level in v1 v2 v3 v4; do
            if [ "$level" = "v1" ]; then
              target_cpu="x86-64"
            else
              target_cpu="x86-64-$level"
            fi
            # Use an explicit target so build scripts and proc-macros are
            # compiled for the runner CPU, not for the selected -v4 CPU.
            RUSTFLAGS="-C target-cpu=$target_cpu" \
              cargo build --release --target x86_64-unknown-linux-gnu \
              --all-features --bin serverrs \
              --manifest-path serverrs/Cargo.toml
            cp serverrs/target/x86_64-unknown-linux-gnu/release/serverrs \
              "dist/serverrs-linux-amd64-$level"
          done
      - uses: actions/upload-artifact@v7
        with:
          name: serverrs-linux-amd64
          path: dist/serverrs-linux-amd64-*

  linux-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: mozilla-actions/sccache-action@v0.0.11
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: serverrs -> target
          cache-targets: false
      - name: Build tools
        run: sudo apt-get update && sudo apt-get install -y cmake build-essential
      - name: Build Cortex-A53/A72/A76
        run: |
          mkdir -p dist
          for cpu in cortex-a53 cortex-a72 cortex-a76; do
            RUSTFLAGS="-C target-cpu=$cpu" \
              cargo build --release --all-features --bin serverrs \
              --manifest-path serverrs/Cargo.toml
            cp serverrs/target/release/serverrs "dist/serverrs-linux-arm64-$cpu"
          done
      - uses: actions/upload-artifact@v7
        with:
          name: serverrs-linux-arm64
          path: dist/serverrs-linux-arm64-*

  macos-arm64:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: mozilla-actions/sccache-action@v0.0.11
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: serverrs -> target
          cache-targets: false
      - name: Build tools
        run: command -v cmake >/dev/null || brew install cmake
      - name: Build Apple Silicon
        run: |
          cargo build --release --all-features --bin serverrs \
            --manifest-path serverrs/Cargo.toml
          mkdir -p dist
          cp serverrs/target/release/serverrs dist/serverrs-macos-arm64
      - uses: actions/upload-artifact@v7
        with:
          name: serverrs-macos-arm64
          path: dist/serverrs-macos-arm64

  macos-x86_64:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: mozilla-actions/sccache-action@v0.0.11
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: serverrs -> target
          cache-targets: false
      - name: Build tools
        run: command -v cmake >/dev/null || brew install cmake
      - name: Build Intel
        run: |
          cargo build --release --all-features --bin serverrs \
            --manifest-path serverrs/Cargo.toml
          mkdir -p dist
          cp serverrs/target/release/serverrs dist/serverrs-macos-x86_64
      - uses: actions/upload-artifact@v7
        with:
          name: serverrs-macos-x86_64
          path: dist/serverrs-macos-x86_64

  windows-amd64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: mozilla-actions/sccache-action@v0.0.11
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: serverrs -> target
          cache-targets: false
      - name: Build Windows 11 (x86-64)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          cargo build --release --all-features --bin serverrs `
            --manifest-path serverrs/Cargo.toml
          Copy-Item serverrs/target/release/serverrs.exe `
            dist/serverrs-windows-amd64.exe
      - uses: actions/upload-artifact@v7
        with:
          name: serverrs-windows-amd64
          path: dist/serverrs-windows-amd64.exe

  client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 26
      - name: Build web client
        run: |
          npm ci --workspace=client
          npm run build --workspace=client
      - uses: actions/upload-artifact@v7
        with:
          name: client-dist
          path: client/dist

  electron-linux-amd64:
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: mozilla-actions/sccache-action@v0.0.11
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: serverrs -> target
          cache-targets: false
      - name: Build tools
        run: sudo apt-get update && sudo apt-get install -y cmake build-essential
      - name: Sync desktop version
        env:
          NO_SDR_VERSION: ${{ github.event.release.tag_name }}
        run: node desktop/scripts/sync-version.cjs
      - name: Build server
        run: cargo build --release --all-features --bin serverrs --manifest-path serverrs/Cargo.toml
      - uses: actions/setup-node@v5
        with:
          node-version: 26
      - name: Build client and Electron packages
        run: |
          npm ci
          npm run build:client
          npm run dist:linux --workspace=desktop
      - uses: actions/upload-artifact@v7
        with:
          name: no-sdr-electron-linux-amd64
          path: |
            desktop/release/*.AppImage
            desktop/release/*.deb

  electron-linux-arm64:
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: mozilla-actions/sccache-action@v0.0.11
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: serverrs -> target
          cache-targets: false
      - name: Build tools
        run: sudo apt-get update && sudo apt-get install -y cmake build-essential
      - name: Sync desktop version
        env:
          NO_SDR_VERSION: ${{ github.event.release.tag_name }}
        run: node desktop/scripts/sync-version.cjs
      - name: Build server
        run: cargo build --release --all-features --bin serverrs --manifest-path serverrs/Cargo.toml
      - uses: actions/setup-node@v5
        with:
          node-version: 26
      - name: Build client and Electron packages
        run: |
          npm ci
          npm run build:client
          npm run dist:linux --workspace=desktop
      - uses: actions/upload-artifact@v7
        with:
          name: no-sdr-electron-linux-arm64
          path: |
            desktop/release/*.AppImage
            desktop/release/*.deb

  electron-macos-arm64:
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    runs-on: macos-15
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: mozilla-actions/sccache-action@v0.0.11
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: serverrs -> target
          cache-targets: false
      - name: Build tools
        run: command -v cmake >/dev/null || brew install cmake
      - name: Sync desktop version
        env:
          NO_SDR_VERSION: ${{ github.event.release.tag_name }}
        run: node desktop/scripts/sync-version.cjs
      - name: Build server
        run: cargo build --release --all-features --bin serverrs --manifest-path serverrs/Cargo.toml
      - uses: actions/setup-node@v5
        with:
          node-version: 26
      - name: Build client and Electron packages
        run: |
          npm ci
          npm run build:client
          npm run dist:mac --workspace=desktop
      - uses: actions/upload-artifact@v7
        with:
          name: no-sdr-electron-macos-arm64
          path: |
            desktop/release/*.dmg
            desktop/release/*.zip

  electron-macos-x86_64:
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    runs-on: macos-15-intel
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: mozilla-actions/sccache-action@v0.0.11
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: serverrs -> target
          cache-targets: false
      - name: Build tools
        run: command -v cmake >/dev/null || brew install cmake
      - name: Sync desktop version
        env:
          NO_SDR_VERSION: ${{ github.event.release.tag_name }}
        run: node desktop/scripts/sync-version.cjs
      - name: Build server
        run: cargo build --release --all-features --bin serverrs --manifest-path serverrs/Cargo.toml
      - uses: actions/setup-node@v5
        with:
          node-version: 26
      - name: Build client and Electron packages
        run: |
          npm ci
          npm run build:client
          npm run dist:mac --workspace=desktop
      - uses: actions/upload-artifact@v7
        with:
          name: no-sdr-electron-macos-x86_64
          path: |
            desktop/release/*.dmg
            desktop/release/*.zip

  electron-windows-amd64:
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: mozilla-actions/sccache-action@v0.0.11
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: serverrs -> target
          cache-targets: false
      - name: Sync desktop version
        shell: pwsh
        env:
          NO_SDR_VERSION: ${{ github.event.release.tag_name }}
        run: node desktop/scripts/sync-version.cjs
      - name: Build server
        shell: pwsh
        run: |
          cargo build --release --all-features --bin serverrs `
            --manifest-path serverrs/Cargo.toml
      - uses: actions/setup-node@v5
        with:
          node-version: 26
      - name: Build client and Electron packages
        shell: pwsh
        run: |
          npm ci
          npm run build:client
          npm run dist:win --workspace=desktop
      - uses: actions/upload-artifact@v7
        with:
          name: no-sdr-electron-windows-amd64
          path: desktop/release/*.exe

  package:
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    needs: [linux-amd64, linux-arm64, macos-arm64, macos-x86_64, windows-amd64, client]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            version="${{ github.event.release.tag_name }}"
          else
            version=$(grep -m1 '^version' serverrs/Cargo.toml | sed 's/.*"\(.*\)"/\1/')
          fi
          version="${version#v}"
          echo "value=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v7
        with:
          path: artifacts
          merge-multiple: true
      - uses: actions/download-artifact@v7
        with:
          name: client-dist
          path: client-dist
      - name: Package portable archives
        run: |
          sudo apt-get update && sudo apt-get install -y zip
          ./packaging/package.sh \
            "${{ steps.version.outputs.value }}" \
            artifacts \
            client-dist \
            package-out
      - uses: actions/upload-artifact@v7
        with:
          name: serverrs-release-archives
          path: package-out/archives/*

  release:
    if: github.event_name == 'release'
    needs:
      - package
      - electron-linux-amd64
      - electron-linux-arm64
      - electron-macos-arm64
      - electron-macos-x86_64
      - electron-windows-amd64
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: serverrs-release-archives
          path: dist
      - uses: actions/download-artifact@v7
        with:
          pattern: no-sdr-electron-*
          path: electron-dist
          merge-multiple: true
      - name: Checksums for desktop packages
        run: |
          cd electron-dist
          sha256sum ./* > SHA256SUMS
      - name: Attach portable archives and desktop packages to release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/SHA256SUMS
            electron-dist/*.AppImage
            electron-dist/*.deb
            electron-dist/*.dmg
            electron-dist/*.zip
            electron-dist/*.exe
            electron-dist/SHA256SUMS
