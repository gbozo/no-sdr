[package]
name = "serverrs"
version = "2.15.0"
edition = "2021"
rust-version = "1.85"
description = "Multi-user WebSDR server"
license = "GPL-3.0-or-later"

[[bin]]
name = "serverrs"
path = "src/main.rs"

[lib]
name = "serverrs"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
async-trait = "0.1"
axum = { version = "0.8", features = ["ws", "macros", "multipart"] }
base64 = "0.22"
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
flate2 = { version = "1", features = ["zlib-rs"] }
futures-util = "0.3"
hex = "0.4"
hmac = "0.12"
num-complex = "0.4"
parking_lot = "0.12"
rand = "0.8"
rustfft = "6"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "multipart"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha1 = "0.10"
sha2 = "0.10"
subtle = "2"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util", "signal", "process"] }
tokio-tungstenite = "0.26"
tower = "0.5"
tower-http = { version = "0.6", features = ["fs", "cors", "trace", "set-header"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }

# Optional codecs/hardware.
opus = { version = "0.3", optional = true }
# Pure-Rust USB for the native SDR drivers. No libusb or vendor libraries.
nusb = { version = "0.2", optional = true }
# HackRF One/Pro driver, pinned to the sdroxide revision we adapted against.
sdroxide-hackrf = { git = "https://github.com/dividebysandwich/sdroxide", rev = "6f0994e72850a15d2a7440d1fde742934a38aea0", optional = true }
sdroxide-types = { git = "https://github.com/dividebysandwich/sdroxide", rev = "6f0994e72850a15d2a7440d1fde742934a38aea0", optional = true }
sdroxide-airspy = { git = "https://github.com/dividebysandwich/sdroxide", rev = "6f0994e72850a15d2a7440d1fde742934a38aea0", optional = true }
sdroxide-airspyhf = { git = "https://github.com/dividebysandwich/sdroxide", rev = "6f0994e72850a15d2a7440d1fde742934a38aea0", optional = true }
sdroxide-hydrasdr = { git = "https://github.com/dividebysandwich/sdroxide", rev = "6f0994e72850a15d2a7440d1fde742934a38aea0", optional = true }
sdroxide-elad = { git = "https://github.com/dividebysandwich/sdroxide", rev = "6f0994e72850a15d2a7440d1fde742934a38aea0", optional = true }
sdroxide-rx888 = { git = "https://github.com/dividebysandwich/sdroxide", rev = "6f0994e72850a15d2a7440d1fde742934a38aea0", optional = true }
sdroxide-pluto = { git = "https://github.com/dividebysandwich/sdroxide", rev = "6f0994e72850a15d2a7440d1fde742934a38aea0", optional = true }
# Vendor-library backends. These are dlopen'd at runtime, so the crates build
# everywhere and simply report a missing service/library at open time.
sdroxide-sdrplay = { git = "https://github.com/dividebysandwich/sdroxide", rev = "6f0994e72850a15d2a7440d1fde742934a38aea0", optional = true }
sdroxide-lime = { git = "https://github.com/dividebysandwich/sdroxide", rev = "6f0994e72850a15d2a7440d1fde742934a38aea0", optional = true }
sdroxide-fobos = { git = "https://github.com/dividebysandwich/sdroxide", rev = "6f0994e72850a15d2a7440d1fde742934a38aea0", optional = true }
# 1090 MHz ADS-B / Mode S decoder. Pure Rust, fed from the raw device stream.
sdroxide-adsb = { git = "https://github.com/dividebysandwich/sdroxide", rev = "6f0994e72850a15d2a7440d1fde742934a38aea0", optional = true }
# VHF marine AIS receiver. Raw IQ, both channels; pure Rust.
sdroxide-ais = { git = "https://github.com/dividebysandwich/sdroxide", rev = "6f0994e72850a15d2a7440d1fde742934a38aea0", optional = true }
# VHF air/ground VDL Mode 2. Raw IQ, fourteen 25 kHz channels.
sdroxide-vdl2 = { git = "https://github.com/dividebysandwich/sdroxide", rev = "6f0994e72850a15d2a7440d1fde742934a38aea0", optional = true }
sdroxide-hfdl = { git = "https://github.com/dividebysandwich/sdroxide", rev = "6f0994e72850a15d2a7440d1fde742934a38aea0", optional = true }
sdroxide-aprs = { git = "https://github.com/dividebysandwich/sdroxide", rev = "6f0994e72850a15d2a7440d1fde742934a38aea0", optional = true }
sdroxide-ax25 = { git = "https://github.com/dividebysandwich/sdroxide", rev = "6f0994e72850a15d2a7440d1fde742934a38aea0", optional = true }
sdroxide-ism = { git = "https://github.com/dividebysandwich/sdroxide", rev = "6f0994e72850a15d2a7440d1fde742934a38aea0", optional = true }
# WSJT-family background decoders (FT8/FT4 first). Pure Rust; GPL-3.0-only.
mfsk-core = { version = "0.14.0", default-features = false, features = ["std", "ft8", "ft4", "fst4", "q65", "jt65", "jt9", "wspr", "msk144", "parallel", "fft-rustfft"], optional = true }
rayon = { version = "1", optional = true }
rusqlite = { version = "0.42", features = ["bundled"], optional = true }

[features]
# The default build enables every feature we ship.
default = ["opus", "rtlsdr", "bias-t", "hackrf", "airspy", "airspyhf", "hydrasdr", "elad", "rx888", "pluto", "sdrplay", "lime", "fobos", "decoders", "adsb", "ais", "vdl2", "hfdl", "aprs", "navtex", "ism", "packet", "wefax", "sstv", "hell", "text", "meteor", "wspr", "pi4", "js8", "time"]
opus = ["dep:opus"]
rtlsdr = ["dep:nusb"]
hackrf = ["dep:sdroxide-hackrf", "dep:sdroxide-types"]
airspy = ["dep:sdroxide-airspy", "dep:sdroxide-types"]
airspyhf = ["dep:sdroxide-airspyhf", "dep:sdroxide-types"]
hydrasdr = ["dep:sdroxide-hydrasdr", "dep:sdroxide-types"]
elad = ["dep:sdroxide-elad", "dep:sdroxide-types"]
rx888 = ["dep:sdroxide-rx888", "dep:sdroxide-types"]
pluto = ["dep:sdroxide-pluto", "dep:sdroxide-types"]
sdrplay = ["dep:sdroxide-sdrplay", "dep:sdroxide-types"]
lime = ["dep:sdroxide-lime", "dep:sdroxide-types"]
fobos = ["dep:sdroxide-fobos"]
decoders = ["dep:mfsk-core", "dep:rayon", "dep:rusqlite"]
# Raw-IQ ADS-B/Mode S decoding. Independent of the slotted mfsk decoders,
# but hosted by the same worker/transport layer.
adsb = ["decoders", "dep:sdroxide-adsb", "dep:sdroxide-types"]
# Raw-IQ AIS/Marine VHF decoding, hosted by the same decoder worker.
ais = ["decoders", "dep:sdroxide-ais", "dep:sdroxide-types"]
# Raw-IQ VDL Mode 2 decoding, hosted by the same decoder worker.
vdl2 = ["decoders", "dep:sdroxide-vdl2", "dep:sdroxide-types"]
hfdl = ["decoders", "dep:sdroxide-hfdl", "dep:sdroxide-types"]
aprs = ["decoders", "dep:sdroxide-aprs", "dep:sdroxide-ax25"]
packet = ["decoders", "dep:sdroxide-ax25"]
navtex = ["decoders"]
ism = ["decoders", "dep:sdroxide-ism", "dep:sdroxide-types"]
wefax = ["decoders"]
sstv = ["decoders", "dep:sdroxide-types"]
hell = ["decoders", "dep:sdroxide-types"]
text = ["decoders"]
meteor = ["decoders"]
wspr = ["decoders"]
pi4 = ["decoders"]
js8 = ["decoders", "dep:sdroxide-types"]
time = ["decoders"]
# Bias-T (GPIO 0) on the antenna port. Default on so local RTL-SDR builds can
# power a mast LNA/photodiode; drop it with --no-default-features for a build
# that must never put DC on the feedline.
bias-t = ["rtlsdr"]

[patch."https://github.com/dividebysandwich/sdroxide"]
# The drivers only need the DSP primitives (Complex32, WbDdc, ...); the
# upstream sdroxide-dsp crate also pulls DeepFilterNet/tract for unrelated
# speech denoising.
sdroxide-dsp = { path = "vendor/sdroxide-dsp" }

[[example]]
name = "rtlsdr_probe"
path = "examples/rtlsdr_probe.rs"
required-features = ["rtlsdr"]

[dev-dependencies]
approx = "0.5"
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
