<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>NO(DE)-SDR</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #07090e;
        --panel: #101722;
        --border: #223044;
        --text: #d7e4f2;
        --dim: #6e829a;
        --accent: #35d6e6;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at 50% 20%, #172538 0, transparent 55%),
          var(--bg);
        color: var(--text);
        font-family: "JetBrains Mono", "SFMono-Regular", Consolas, monospace;
      }
      main {
        width: min(560px, calc(100vw - 48px));
        border: 1px solid var(--border);
        background: color-mix(in srgb, var(--panel) 88%, transparent);
        border-radius: 6px;
        padding: 28px 30px;
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.45);
      }
      .eyebrow {
        color: var(--dim);
        font-size: 10px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }
      h1 {
        margin: 8px 0 10px;
        font-size: 26px;
        font-weight: 500;
        letter-spacing: 0.06em;
      }
      p {
        margin: 0;
        color: var(--dim);
        font-size: 12px;
        line-height: 1.7;
      }
      .bar {
        margin-top: 22px;
        height: 2px;
        overflow: hidden;
        background: #192536;
        border-radius: 2px;
      }
      .bar::before {
        content: "";
        display: block;
        width: 38%;
        height: 100%;
        background: var(--accent);
        animation: scan 1.25s ease-in-out infinite;
        box-shadow: 0 0 12px color-mix(in srgb, var(--accent) 55%, transparent);
      }
      @keyframes scan {
        0% {
          transform: translateX(-110%);
        }
        100% {
          transform: translateX(300%);
        }
      }
      .foot {
        margin-top: 14px;
        font-size: 10px;
        color: #4b5b70;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="eyebrow">Local receiver service</div>
      <h1>NO(DE)-SDR</h1>
      <p>Starting the DSP pipeline and preparing the waterfall…</p>
      <div class="bar"></div>
      <p class="foot">The first launch can take a few seconds.</p>
    </main>
  </body>
</html>
